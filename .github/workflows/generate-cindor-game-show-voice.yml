name: Generate Cindor game-show presenter voice

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-cindor-game-show-voice.py"
      - ".github/workflows/generate-cindor-game-show-voice.yml"

permissions:
  contents: write

concurrency:
  group: cindor-game-show-voiceover
  cancel-in-progress: true

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free Edge TTS and MP3 tooling
        run: python -m pip install --disable-pip-version-check edge-tts pydub imageio-ffmpeg
      - name: Generate energetic Argentine Spanish presenter voice
        run: python scripts/generate-cindor-game-show-voice.py
      - name: Commit generated voice and word timings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/studio/audio/cindor-game-show-voice-es-AR.mp3 public/studio/audio/cindor-game-show-word-timings.json
          git diff --cached --quiet || git commit -m "Add energetic Cindor game-show presenter voice"
          git pull --rebase origin main
          git push
