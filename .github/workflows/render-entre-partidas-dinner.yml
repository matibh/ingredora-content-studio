name: Render Entre Partidas dinner episode

on:
  push:
    branches: ["feature/entre-partidas-ad-engine"]
    paths:
      - "src/engine/entrePartidasDinner.ts"
      - "src/engine/renderer.ts"
      - "src/engine/types.ts"
      - "src/render-dinner.ts"
      - "public/studio/packages/entre-partidas-dinner.v1.json"
      - "scripts/generate-entre-partidas-dinner-audio.py"
      - "scripts/render-dinner.mjs"
      - "render-dinner.html"
      - ".github/workflows/render-entre-partidas-dinner.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entre-partidas-dinner-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout uploaded laughter and outro
        uses: actions/checkout@v4
        with:
          ref: main
          path: _uploaded-audio-assets
      - name: Stage the original uploaded MP3 files
        run: |
          mkdir -p public/studio/audio/entre-partidas/dinner-02
          cp "_uploaded-audio-assets/risa.mp3" public/studio/audio/entre-partidas/dinner-02/risa.mp3
          cp "_uploaded-audio-assets/risa y outro.mp3" "public/studio/audio/entre-partidas/dinner-02/risa-y-outro.mp3"
          test -s public/studio/audio/entre-partidas/dinner-02/risa.mp3
          test -s public/studio/audio/entre-partidas/dinner-02/risa-y-outro.mp3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project and browser automation
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build TypeScript and Vite
        run: npm run build
      - name: Start Vite source server for the render harness
        run: |
          npm run dev -- --host 0.0.0.0 --port 4173 > /tmp/vite-dinner.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 2
          done
      - name: Install FFmpeg and the five-voice synthesis tool
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m venv /tmp/entre-partidas-dinner
          /tmp/entre-partidas-dinner/bin/python -m pip install --disable-pip-version-check --no-cache-dir edge-tts pydub
      - name: Generate five distinct voices, timed laughter and supplied outro
        run: /tmp/entre-partidas-dinner/bin/python scripts/generate-entre-partidas-dinner-audio.py
      - name: Render the five-character apartment dinner
        run: node scripts/render-dinner.mjs
      - name: Preserve original WebM render
        uses: actions/upload-artifact@v4
        with:
          name: ingredora-entre-partidas-cena-webm
          path: /tmp/ingredora-entre-partidas-cena.webm
          if-no-files-found: error
          retention-days: 30
      - name: Print Vite diagnostics on failure
        if: failure()
        run: cat /tmp/vite-dinner.log || true
      - name: Convert WebM to MP4
        run: |
          ffmpeg -y -i /tmp/ingredora-entre-partidas-cena.webm -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart /tmp/ingredora-entre-partidas-cena.mp4
          test -s /tmp/ingredora-entre-partidas-cena.mp4
      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: ingredora-entre-partidas-cena-mp4
          path: /tmp/ingredora-entre-partidas-cena.mp4
          if-no-files-found: error
          retention-days: 30
