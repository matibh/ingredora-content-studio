name: Generate Oreo family voiceover

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-oreo-family-voice.py"
      - ".github/workflows/generate-oreo-family-voice.yml"

permissions:
  contents: write

concurrency:
  group: oreo-family-voiceover
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free Edge TTS client
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate Argentine Spanish female narration
        run: python scripts/generate-oreo-family-voice.py
      - name: Commit generated audio and word timings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/studio/audio/oreo-family-v1-voice-es-AR.mp3 public/studio/audio/oreo-family-v1-word-timings.json
          git diff --cached --quiet || git commit -m "Add Oreo family Argentine Spanish voiceover"
          git pull --rebase origin main
          git push
