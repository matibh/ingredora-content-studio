name: Render Entre Partidas supermarket video

on:
  push:
    branches: ["feature/entre-partidas-ad-engine"]
    paths:
      - "src/engine/**"
      - "src/render-supermarket.ts"
      - "public/studio/packages/entre-partidas-supermarket.v1.json"
      - "public/studio/audio/entre-partidas/**"
      - "scripts/render-supermarket.*"
      - "scripts/prepare-entre-partidas-audio.py"
      - "render-supermarket.html"
      - ".github/workflows/render-entre-partidas-supermarket.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entre-partidas-supermarket-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the uploaded laughter and outro assets
        uses: actions/checkout@v4
        with:
          ref: main
          path: _uploaded-audio-assets
      - name: Stage the uploaded laughter and outro
        run: |
          mkdir -p public/studio/audio/entre-partidas/supermarket-01 public/studio/audio/entre-partidas/supermarket-02
          cp "_uploaded-audio-assets/risa.mp3" public/studio/audio/entre-partidas/supermarket-01/risa.mp3
          cp "_uploaded-audio-assets/risa y outro.mp3" "public/studio/audio/entre-partidas/supermarket-01/risa-y-outro.mp3"
          cp "_uploaded-audio-assets/risa y outro.mp3" "public/studio/audio/entre-partidas/supermarket-02/risa-y-outro.mp3"
          test -s public/studio/audio/entre-partidas/supermarket-01/risa.mp3
          test -s public/studio/audio/entre-partidas/supermarket-01/risa-y-outro.mp3
          test -s public/studio/audio/entre-partidas/supermarket-02/risa-y-outro.mp3
          echo "OUTRO_DURATION=$(ffprobe -v error -show_entries format=duration -of csv=p=0 public/studio/audio/entre-partidas/supermarket-02/risa-y-outro.mp3)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project and browser automation
        run: |
          npm install
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build TypeScript and Vite
        run: npm run build
      - name: Start Vite source server for the render harness
        run: |
          npm run dev -- --host 0.0.0.0 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 2
          done
      - name: Install FFmpeg for voice edits and final MP4
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffmpeg -hide_banner -encoders | grep -E 'libx264| h264 '
      - name: Install Edge TTS for the Tomás and Ernesto dialogue
        run: |
          python3 -m venv /tmp/edge-tts
          /tmp/edge-tts/bin/python -m pip install --disable-pip-version-check --no-cache-dir edge-tts
      - name: Generate Tomás and Ernesto dialogue, then append the uploaded laughter outro
        run: /tmp/edge-tts/bin/python scripts/prepare-entre-partidas-tomas-audio.py
      - name: Render the complete Three.js scene with narration
        run: node scripts/render-supermarket.mjs
      - name: Preserve original WebM render
        uses: actions/upload-artifact@v4
        with:
          name: ingredora-entre-partidas-supermercado-webm
          path: /tmp/ingredora-entre-partidas-supermercado.webm
          if-no-files-found: error
          retention-days: 30
      - name: Print Vite diagnostics on failure
        if: failure()
        run: cat /tmp/vite-preview.log || true
      - name: Convert WebM to MP4
        run: |
          ffmpeg -y -i /tmp/ingredora-entre-partidas-supermercado.webm -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart /tmp/ingredora-entre-partidas-supermercado.mp4
          test -s /tmp/ingredora-entre-partidas-supermercado.mp4
      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: ingredora-entre-partidas-supermercado-mp4
          path: /tmp/ingredora-entre-partidas-supermercado.mp4
          if-no-files-found: error
          retention-days: 30
