name: Render Entre Partidas supermarket video

on:
  push:
    branches: ["feature/entre-partidas-ad-engine"]
    paths:
      - "src/engine/**"
      - "public/studio/packages/entre-partidas-supermarket.v1.json"
      - "public/studio/audio/entre-partidas/**"
      - "scripts/render-supermarket.*"
      - "render-supermarket.html"
      - ".github/workflows/render-entre-partidas-supermarket.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project and browser automation
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Build TypeScript and Vite
        run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 2
          done
      - name: Render the complete Three.js scene with narration
        run: node scripts/render-supermarket.mjs
      - name: Convert WebM to MP4
        run: ffmpeg -y -i /tmp/ingredora-entre-partidas-supermercado.webm -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -movflags +faststart /tmp/ingredora-entre-partidas-supermercado.mp4
      - name: Upload final MP4
        uses: actions/upload-artifact@v4
        with:
          name: ingredora-entre-partidas-supermercado-mp4
          path: /tmp/ingredora-entre-partidas-supermercado.mp4
          if-no-files-found: error
          retention-days: 30
