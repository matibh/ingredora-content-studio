name: Generate Nutella voiceover

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nutella-voiceover
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Argentine Spanish narration
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: node scripts/generate-nutella-voice.mjs
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/studio/audio/nutella-v5-voice-es-AR.mp3
          git diff --cached --quiet || git commit -m "Add Nutella v5 Argentine Spanish voiceover"
          git push
