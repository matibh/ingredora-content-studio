name: Generate Nutella voiceover

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nutella-voiceover
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free Edge TTS client
        run: python -m pip install --disable-pip-version-check edge-tts
      - name: Generate Argentine Spanish neural narration
        run: python scripts/generate-nutella-voice.py
      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/studio/audio/nutella-v5-voice-es-AR.mp3
          git diff --cached --quiet || git commit -m "Add Nutella v5 Argentine Spanish voiceover"
          git push
