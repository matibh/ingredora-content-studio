name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # The voice generator commits its MP3 with GITHUB_TOKEN, which does not
  # trigger another push workflow. Deploy again after that workflow succeeds.
  workflow_run:
    workflows: ["Generate Cindor game-show presenter voice", "Generate Ingredora Operation Label voice", "Generate Entre Partidas five-character voices"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-coca-cola-v6-1"
  # Serialize the initial push deploy and the post-voice deploy; never let
  # an older build cancel the deployment that contains the generated MP3.
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main (including generated voice assets)
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

# Redeploy trigger: include generated voiceover and word-level caption timing assets.
