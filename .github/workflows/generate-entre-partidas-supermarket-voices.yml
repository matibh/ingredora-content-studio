name: Generate Entre Partidas supermarket scene voices

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/generate-entre-partidas-supermarket-voices.py"
      - ".github/workflows/generate-entre-partidas-supermarket-voices.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: entre-partidas-supermarket-scene-voices
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install zero-cost voice tooling
        run: python -m pip install --disable-pip-version-check edge-tts pydub imageio-ffmpeg
      - name: Generate scene voices and word timing
        run: python scripts/generate-entre-partidas-supermarket-voices.py
      - name: Commit audio stems and activate the episode package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/studio/audio/entre-partidas/supermarket-scene-v1 public/studio/series/entre-partidas/episodes/s01e01-supermarket-scene-01.json public/studio/productions.json
          git diff --cached --quiet || git commit -m "Add Spanish voices for Entre Partidas supermarket scene"
          git push origin HEAD:main
